name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy-worker:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vanish-worker-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve the Pro Stripe price
        id: stripe-price
        run: echo "price_id=$(node scripts/ensure-stripe-pro-price.mjs)" >> "$GITHUB_OUTPUT"
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}

      - name: Run D1 migrations
        run: npx wrangler d1 migrations apply vanish-db --remote
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Provision the Pro Stripe price
        run: echo "${{ steps.stripe-price.outputs.price_id }}" | npx wrangler secret put STRIPE_PRO_PRICE_ID_EUR_10
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resolve the custom-domain zone
        id: handoff-zone
        working-directory: packages/worker
        env:
          CUSTOM_HOSTNAMES_API_TOKEN: ${{ secrets.CLOUDFLARE_CUSTOM_HOSTNAMES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "zone_id=$(node ../../scripts/resolve-cloudflare-zone-id.mjs vanish.sh)" >> "$GITHUB_OUTPUT"

      - name: Provision Handoff runtime secrets
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUSTOM_HOSTNAMES_API_TOKEN: ${{ secrets.CLOUDFLARE_CUSTOM_HOSTNAMES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_ZONE_ID: ${{ steps.handoff-zone.outputs.zone_id }}
          ACCESS_SECRET: ${{ secrets.VANISH_ACCESS_SESSION_SECRET }}
        run: |
          test -n "$CUSTOM_HOSTNAMES_API_TOKEN"
          test -n "$WORKER_ZONE_ID"
          test -n "$ACCESS_SECRET"
          printf '%s' "$CUSTOM_HOSTNAMES_API_TOKEN" | npx wrangler secret put CLOUDFLARE_API_TOKEN
          printf '%s' "$WORKER_ZONE_ID" | npx wrangler secret put CLOUDFLARE_ZONE_ID
          printf '%s' "$ACCESS_SECRET" | npx wrangler secret put ACCESS_SESSION_SECRET

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update the rollback-compatible Stripe price
        run: echo "${{ steps.stripe-price.outputs.price_id }}" | npx wrangler secret put STRIPE_PRICE_ID
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
