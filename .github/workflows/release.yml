name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['packages/cli--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Build CLI
        run: npm run build --workspace=vanish-cli

      - name: Publish to npm
        run: npm publish --workspace=vanish-cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-worker:
    needs: release-please
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve the Pro Stripe price
        id: stripe-price
        run: echo "price_id=$(node scripts/ensure-stripe-pro-price.mjs)" >> "$GITHUB_OUTPUT"
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}

      - name: Run D1 migrations
        run: npx wrangler d1 migrations apply vanish-db --remote
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Provision the Pro Stripe price
        run: echo "${{ steps.stripe-price.outputs.price_id }}" | npx wrangler secret put STRIPE_PRO_PRICE_ID_EUR_10
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resolve the custom-domain zone
        id: handoff-zone
        working-directory: packages/worker
        env:
          CUSTOM_HOSTNAMES_API_TOKEN: ${{ secrets.CLOUDFLARE_CUSTOM_HOSTNAMES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "zone_id=$(node ../../scripts/resolve-cloudflare-zone-id.mjs vanish.sh)" >> "$GITHUB_OUTPUT"

      - name: Provision Worker secrets
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUSTOM_HOSTNAMES_API_TOKEN: ${{ secrets.CLOUDFLARE_CUSTOM_HOSTNAMES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_ZONE_ID: ${{ steps.handoff-zone.outputs.zone_id }}
          ACCESS_SECRET: ${{ secrets.VANISH_ACCESS_SESSION_SECRET }}
        run: |
          test -n "$CUSTOM_HOSTNAMES_API_TOKEN"
          test -n "$WORKER_ZONE_ID"
          test -n "$ACCESS_SECRET"
          echo "${{ secrets.GH_OAUTH_CLIENT_ID }}" | npx wrangler secret put GITHUB_CLIENT_ID
          echo "${{ secrets.GH_OAUTH_CLIENT_SECRET }}" | npx wrangler secret put GITHUB_CLIENT_SECRET
          echo "${{ secrets.STRIPE_SECRET_KEY }}" | npx wrangler secret put STRIPE_SECRET_KEY
          echo "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | npx wrangler secret put STRIPE_WEBHOOK_SECRET
          printf '%s' "$CUSTOM_HOSTNAMES_API_TOKEN" | npx wrangler secret put CLOUDFLARE_API_TOKEN
          printf '%s' "$WORKER_ZONE_ID" | npx wrangler secret put CLOUDFLARE_ZONE_ID
          printf '%s' "$ACCESS_SECRET" | npx wrangler secret put ACCESS_SESSION_SECRET

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update the rollback-compatible Stripe price
        run: echo "${{ steps.stripe-price.outputs.price_id }}" | npx wrangler secret put STRIPE_PRICE_ID
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
