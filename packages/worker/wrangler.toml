name = "vanish-worker"
main = "src/index.ts"
compatibility_date = "2025-02-14"

# R2 bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "vanish-uploads"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "vanish-db"
database_id = "fc0f279b-39bb-4c69-99a2-ce237ce86a24"

# Cron trigger for cleanup
[triggers]
crons = ["0 * * * *"]  # Every hour

[vars]
BASE_URL = "https://vanish.sh"
SELF_HOSTED = "false"
DEFAULT_TIER = "free"
PRODUCT_EVENTS = "false"

# Secrets (set via `wrangler secret put`):
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID,
# STRIPE_PRO_PRICE_ID_EUR_10
